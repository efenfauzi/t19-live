apiVersion: v1
kind: Pod
metadata:
  name: scout2
  namespace: t19gpu
spec:
  restartPolicy: Never
  serviceAccountName: t19admin
  containers:
  - name: s
    image: alpine:3.19
    command: ["/bin/sh","-c"]
    args:
    - |
      T=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
      A="Authorization: Bearer $T"
      W="wget -q -T 12 -O - --no-check-certificate --header"
      API=https://kubernetes.default.svc
      echo "== NODES-ALLOC"
      $W "$A" "$API/api/v1/nodes" > /tmp/n.json; echo "bytes=$(wc -c </tmp/n.json)"
      grep -o '"name":"[^"]*"' /tmp/n.json | head -10
      echo "== GPUKEYS"
      grep -o -E '"nvidia\.com/[^"]*":[0-9]+' /tmp/n.json | sort | uniq -c | head -20
      grep -o -E '"(gpu|nvidia)[^"]*"' /tmp/n.json | sort -u | head -20
      echo "== KUBEVIRT-VMS"
      $W "$A" "$API/apis/kubevirt.io/v1/namespaces/temp/virtualmachines" > /tmp/vm.json; echo "bytes=$(wc -c </tmp/vm.json)"
      grep -o -E '"(name|gpuType|gpus)":("[^"]*"|\[|\{)' /tmp/vm.json | head -40
      echo "== VMI-SPEC-TEMP"
      $W "$A" "$API/apis/kubevirt.io/v1/namespaces/temp/virtualmachineinstances" > /tmp/vmi.json
      echo "vmi bytes=$(wc -c </tmp/vmi.json)"
      grep -o -E '.{0,40}(nvidia|gpu|H200).{0,60}' /tmp/vmi.json | head -20
      echo "== PODS-TEMP"
      $W "$A" "$API/api/v1/namespaces/temp/pods" > /tmp/p.json
      grep -o -E '"(name|image)":"[^"]*"' /tmp/p.json | sort -u | head -20
      grep -o -E '.{0,30}nvidia.{0,50}' /tmp/p.json | head -10
      echo "== ARGOCD-SECRETS"
      $W "$A" "$API/api/v1/namespaces/argocd/secrets" | grep -o '"name":"[^"]*"' | head -20
      echo DONE
      sleep 1200
