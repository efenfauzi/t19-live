apiVersion: v1
kind: Pod
metadata:
  name: gpupod
  namespace: t19gpu
spec:
  restartPolicy: Never
  containers:
  - name: g
    image: alpine:3.19
    command: ["/bin/sh","-c"]
    args:
    - |
      echo "PODHOST=$(hostname)"; id
      ls -l /dev/nvidia* 2>&1 | head
      (nvidia-smi -L 2>&1 || echo NOSMI) | head -20
      (nvidia-smi --query-gpu=name,memory.total,serial --format=csv,noheader 2>&1 || true) | head
      sleep 1500
    resources:
      limits:
        nvidia.com/H200_SXM: 1
